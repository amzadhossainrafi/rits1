services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ritsone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ritsone
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ritsone"], interval: 5s, retries: 10}
  app:
    build: .
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    env_file: .env
    environment:
      ENV: production
      DATABASE_URL: postgresql://ritsone:${POSTGRES_PASSWORD}@db:5432/ritsone
      BASE_URL: https://${DOMAIN}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: {DOMAIN: "${DOMAIN}"}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data, caddyconfig:/config]
    depends_on: [app]
volumes: {pgdata: {}, caddydata: {}, caddyconfig: {}}
